[package]
name = "radio"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Radio daemon"

[dependencies]
radio-client = { path = "../radio-client" }
radio-link = { path = "../radio-link" }
radio-rooms = { path = "../radio-rooms" }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
