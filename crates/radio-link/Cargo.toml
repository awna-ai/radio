[package]
name = "radio-link"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The link between a person's computers"

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
libc = "=0.2.189"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "sync", "io-util", "macros", "fs"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
sha2 = { version = "=0.11.1", default-features = false }
getrandom = "=0.4.3"
data-encoding = "=2.11.1"
