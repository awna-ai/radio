<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Radio across your computers</title>
  <desc id="desc">Built: two of your computers that can already reach each other, on the same network or a VPN, link directly and encrypted, carrying files, app messages and signed cards. A new computer joins with a one-time code. Coming: a relay that introduces computers and passes encrypted messages it cannot read.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .radio { fill: #0F172A; }
    .ghost { fill: none; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    .light { fill: #F1F5F9; }
    .soft { fill: #94A3B8; }
    .amber { fill: #F59E0B; }
    .link { stroke: #0EA5E9; stroke-width: 3; fill: none; }
    .wire { stroke: #64748B; stroke-width: 1.75; fill: none; }
    .dash { stroke: #94A3B8; stroke-width: 1.75; stroke-dasharray: 6 5; fill: none; }
    .head { fill: #64748B; }
    .h2 { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1E293B; stroke: #334155; }
      .radio { fill: #020617; stroke: #38BDF8; stroke-width: 1.5; }
      .ghost { stroke: #64748B; }
      .ink { fill: #F1F5F9; }
      .muted { fill: #94A3B8; }
      .link { stroke: #38BDF8; }
      .wire { stroke: #94A3B8; }
      .dash { stroke: #64748B; }
      .head { fill: #94A3B8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <path class="link" d="M40 36 H72"/>
  <text class="muted b" x="80" y="41">built</text>
  <path class="dash" d="M40 62 H72"/>
  <text class="muted b" x="80" y="67">coming</text>

  <rect class="ghost" x="330" y="20" width="220" height="62" rx="12"/>
  <text class="ink h2" x="440" y="46" text-anchor="middle">Relay (coming)</text>
  <text class="muted b" x="440" y="68" text-anchor="middle">introduces; can't read messages</text>
  <path class="dash" d="M380 82 L250 120"/>
  <path class="dash" d="M500 82 L630 120"/>

  <rect class="radio" x="40" y="120" width="240" height="130" rx="14"/>
  <text class="light h2" x="60" y="148">Laptop</text>
  <circle class="amber" cx="256" cy="143" r="5"/>
  <text class="soft b" x="60" y="174">its own Radio and key</text>
  <text class="soft b" x="60" y="194">signs a card about itself</text>
  <text class="soft b" x="60" y="214">its own list of the others:</text>
  <text class="soft b" x="60" y="234">accept · block · trust</text>

  <rect class="radio" x="600" y="120" width="240" height="130" rx="14"/>
  <text class="light h2" x="620" y="148">Desktop</text>
  <circle class="amber" cx="816" cy="143" r="5"/>
  <text class="soft b" x="620" y="174">its own Radio and key</text>
  <text class="soft b" x="620" y="194">signs a card about itself</text>
  <text class="soft b" x="620" y="214">its own list of the others:</text>
  <text class="soft b" x="620" y="234">accept · block · trust</text>

  <path class="link" d="M282 185 H598"/>
  <text class="ink b" x="440" y="174" text-anchor="middle" font-weight="600">files · app messages · signed cards</text>
  <text class="muted b" x="440" y="206" text-anchor="middle">direct and encrypted, today on the</text>
  <text class="muted b" x="440" y="224" text-anchor="middle">same network or a VPN you run</text>

  <rect class="card" x="330" y="282" width="220" height="62" rx="12"/>
  <text class="ink h2" x="440" y="308" text-anchor="middle">New computer</text>
  <text class="muted b" x="440" y="330" text-anchor="middle">joins with a one-time code</text>
  <path class="wire" d="M328 313 H160 V254" marker-end="url(#arrow)"/>
</svg>
